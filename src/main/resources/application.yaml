spring:
  application:
    name: TelarMVP
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/finanzas_personales?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:telar_app}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
